        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: monospace;
}
.home-page{  
    background: linear-gradient(rgb(0, 0, 0),#646464,rgb(0, 0, 0));
}
body {
  margin: 0; 
  width: 100%;
  height: 100vh;
  overflow-x: hidden;
}
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 30px 0px 30px;
}
.logo img {
    margin: 1px auto;
    width: 50px;
    border-radius: 12px;
    margin-left: 30px;
}
.nav_container ul {
    list-style-type: none;
    display: flex;
}
.home-page{
    width: 100%;
    
}
#home{
    background: linear-gradient(rgba(128, 0, 128, 1),black);
}
.nav_container ul li {
    /* margin-right: 20px; */
    width: 160px;
    padding: 5px 20px;
    border-radius: 5px;
}
.nav_container ul li a {
    text-decoration: none;
    color: #fff;
    font-size: 20px;
    padding: 10px 15px;
    transition: background-color 0.3s;
}
.nav_container ul li:hover {
    background: linear-gradient(to bottom, rgb(28, 28, 28,0), rgb(255, 147, 228,1));
    border-radius: 5px;
}
.container1 {
    border-radius: 13px;
    width: 950px;
    height:500px;
    display: flex;
    justify-content: space-between;
    background: conic-gradient(from 90deg, rgb(107,107,107),rgb(51, 51, 51),rgb(0, 0, 0),rgb(51, 51, 51),rgb(107, 107, 107));
    align-items: center;
    padding: 40px;
    border: 1px solid black;
    box-shadow: 10px 10px 22px 10px black;
    margin: 100px auto;
}
.content1 {
    color: white;
    flex: 1;
    font-size: 1.6rem;
}
span{
    color: purple;
}
.content1 h1 {
    margin: 10px 0px;
    font-size: 35px;
    font-weight: bold;
}
.content2 button {
    background-color: transparent;
    border: 1px solid white;
    padding: 5px 20px;
    color: purple;
    border-radius: 5px;
    cursor: pointer;
    margin-top: 20px;
    font-size: 18px;
    transition: background-color 0.5s;
}
.content2 button:hover {
    background-color: #F285DE;
    color: #fff;
    font-size: 16px;
    transition: background-color 0.3s;
}
.content2 button:active{
    background-color: #6d055a;
    color: #fff;
    font-size: 14px;
    transition: background-color 0.3s;
}
.pic1 {
    flex: 1;
    display: flex;
    justify-content: center;
}
.pic1 img {
    box-shadow: 0 0 25px purple;
    border-radius: 50%;
    width: 200px;
    border: 1px solid #D700C1;
    animation: floatImage 4s ease-in-out infinite;transition: 0.4s ease;
}
@keyframes floatImage {
    0%{
        transform: translateY(0);
    }
    50%{
        transform: translateY(-1.49rem);
    }
    100%{
        transform: translateY(0);
    }
}
.footer {
    padding: 20px 50px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: white;
}
.footer p {
    font-size: 14px;
}
.mail {
    display: flex;
    align-items: center;
    margin-top: 10px;
}
.mail img {
    width: 20px;
    margin-right: 10px;
}
.linksinfooter {
    display: flex;
    gap: 20px;
}
.linksinfooter div {
    display: flex;
    align-items: center;
}
.linksinfooter img {
    width: 20px;
    margin-right: 10px;
}
.linksinfooter a {
    text-decoration: none;
    color: #fff;
}
.linksinfooter a:hover {
    color: #a100ff;
}
hr { 
    border: 1px solid #baaec4;
    margin: 0px auto;
    width: 1250px;  
    text-align: center;
}

@media ((min-width: 200px)  and (max-width:490px)){
    *{margin: 0;}
    hr{ border: 1px solid #baaec4; margin: 0px 20px; width: 200px; text-align: center;}
    .nav_container{display: none;}
    .container1 {width: 300px; height: 600px;margin: 100px 50px;display: inline-block; align-items: center;}
    .container1 img{width: 180px; position: absolute; top: 200px;}
    .content1{position: absolute;top: 450px;align-items: center;margin-left: 22px;}
    .content1 p{text-align: center;font-size: 16px;}
    .content1 h1{font-size: 26px;}
    #btn1{margin-left: 100px;}
    .bar {display: block;width: 40px;height: 3px;margin: 10px auto;cursor: pointer; background-color: #ffffff;}
    .linksinfooter{display: block;}
    .linksinfooter img {width: 10px; margin-right: 5px;}
    .footer{padding: 1px 44px;}
    .footer p {font-size: 12px;}
    .mail img {width: 10px; margin-right: 10px;}
    .hamburger{display: block;margin-right: 20px;}
} 
@media  (min-width: 500px)  and (max-width:768px){
    *{margin: 0;}
    hr { border: 1px solid #baaec4;margin: 0px auto;width: 640px; text-align: center;}
    .container1 {width: 550px;height: 600px;margin: 100px 50px;display: inline-block; align-items: center;}
    .content1 p{font-size: 18px;text-align: center;}
    .container1 img{width: 180px;position: absolute;top: 200px;}
    .nav_container{display: none;}
    .logo img{width: 40px;}
    .content1{position: absolute;top: 450px;align-items: center;margin-left: 22px;}
    .content1 h1{font-size: 35px;}
    #btn1{margin-left: 150px;}
    .linksinfooter{display: block;}
    .linksinfooter img { width: 10px;margin-right: 5px;}
    .footer p {font-size: 14px;}
    .mail img {width: 13px;margin-right: 10px;}
    .hamburger{display: block;margin-right: 20px;}
    .bar {display: block;width: 40px;height: 3px;margin: 10px auto;cursor: pointer;-webkit-transition: all 0.3s ease-in-out;transition: all 0.3s ease-in-out;background-color: #ffffff; } 
}
@media  (min-width: 768px)  and (max-width:990px){
    *{ margin: 0;}
    .logo img{width: 34px;}
    .nav_container ul li{width: 100px;}
    .nav_container ul li a{font-size: 17px; text-align: center;}
    .container1 {width: 800px;height: 400px;margin: 100px 40px 100px 60px;display: flex;align-items: center; gap: 50px;} 
    .content1{width: 300px;}
    .content1 p{font-size: 16px;}
    .content1 h1{font-size: 30px;}
    .linksinfooter img { width: 16px;margin-right: 5px;}
    .footer p {font-size: 14px;}
    .mail img {width: 10px;margin-right: 10px;}
    
}
@media (max-width: 1200px){
    html{
        font-size: 80%
    }
    hr{
        width: 1100px;
    }
}
@media (max-width: 991px){
    .header{
        padding: 1rem;
    }

}
