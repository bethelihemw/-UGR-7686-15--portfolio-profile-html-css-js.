.skill_page {

.progress-container {
    margin-top: 20px;
}

.progress-container p {
    margin-bottom: 5px;
}

.progress-bar {
    background-color: #eee; /* Light background for the bar */
    height: 10px;
    margin-bottom: 15px;
    border-radius: 5px; /* Rounded corners */
    overflow: hidden; /* Hide overflowing content */
    width: 100%; /* Full width container */
    position: relative;
}

.progress-bar::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    background-image: linear-gradient(to right, rgb(226, 163, 163),rgb(201, 43, 122));
    border-radius: 5px;
    transition: width 0.5s ease; /* Smooth width transition */
}

/* Set the width of the progress bar based on the percentage */
.progress-container p:nth-child(1) + .progress-bar::before { width: 90%; }
.progress-container p:nth-child(3) + .progress-bar::before { width: 50%; }
.progress-container p:nth-child(5) + .progress-bar::before { width: 70%; }
.progress-container p:nth-child(7) + .progress-bar::before { width: 40%; }

/* Hobbies section */
.skill_page > div:last-child { /* Select the last div in skill_page */
    flex: 1;
    padding: 20px;
    text-align: center;
}

.skill_page > div:last-child h3 {
    margin-bottom: 10px;
}

.skill_page > div:last-child img {
    width: 150px; /* Adjust image size as needed */
    height: 150px;
    margin: 5px;
    border: 1px solid #ddd; /* Light border around images */
    box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2); /* Subtle shadow */
    object-fit: cover; /* Prevent image distortion */
}
